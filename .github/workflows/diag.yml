name: 진단
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: molit 접속 확인
        run: |
          echo "== DNS =="; getent hosts rt.molit.go.kr || echo "DNS 실패"
          echo "== curl HEAD =="; curl -sS -m 25 -o /dev/null -w "http=%{http_code} time=%{time_total}\n" https://rt.molit.go.kr/ || echo "curl 실패 rc=$?"
          echo "== curl sido.do =="; curl -sS -m 25 -X POST https://rt.molit.go.kr/data/sido.do -A "Mozilla/5.0" -w "\nhttp=%{http_code}\n" | head -c 300 || echo "실패 rc=$?"
          echo "== IPv4 강제 =="; curl -sS -4 -m 25 -o /dev/null -w "http=%{http_code}\n" https://rt.molit.go.kr/ || echo "실패 rc=$?"
          echo "== applyhome 대조 =="; curl -sS -m 25 -o /dev/null -w "http=%{http_code}\n" -A "Mozilla/5.0" https://www.applyhome.co.kr/ai/aib/selectSubscrptCalenderView.do || echo "실패 rc=$?"
          echo "== data.go.kr 대조 =="; curl -sS -m 25 -o /dev/null -w "http=%{http_code}\n" "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?serviceKey=x&LAWD_CD=11110&DEAL_YMD=202606" || echo "실패 rc=$?"
