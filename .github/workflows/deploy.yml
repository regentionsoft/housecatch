name: 사이트 배포

on:
  # 매일 06:00 KST (21:00 UTC) 에 다시 수집해서 배포
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 예약 실행과 수동 실행이 겹쳐도 안전하게.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 러너는 UTC 라서 그대로 두면 새벽 시간대에 날짜가 하루 밀린다
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 상세 페이지·실거래 CSV 캐시를 이어 써서 청약홈/국토부 부담을 줄인다
      - name: 수집 캐시 복원
        uses: actions/cache@v4
        with:
          path: data
          key: housecatch-data-${{ github.run_id }}
          restore-keys: housecatch-data-

      - name: 청약홈 + 국토부 실거래가 수집
        run: npm run scrape

      - name: 단일 HTML 생성
        run: npm run build:static

      - name: 배포 폴더 구성
        run: |
          mkdir -p site
          cp dist/housecatch-snapshot.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
